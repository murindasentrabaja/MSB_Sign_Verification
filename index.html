<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verifikasi Tanda Tangan Digital</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c1f3d;--ink2:#4a5d78;--paper:#e9eff5;--line:#c9d6e3;--steel:#2f5d9e;--ok:#0b7a5a;--okbg:#dff3ec;--bad:#a8261d;--badbg:#f9e3e0}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);background:var(--paper);min-height:100vh}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.top{background:var(--ink);color:#fff;padding:14px 20px}
.top b{font-weight:600;font-size:16px}.top small{display:block;color:#a9bbd2;font-size:12.5px}
main{max-width:940px;margin:0 auto;padding:20px 16px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:22px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:19px}
.muted{color:var(--ink2)}.center{text-align:center}
.narrow{max-width:380px;margin:36px auto}
.verify{max-width:480px;margin:10px auto;padding:0;overflow:hidden;border-top:5px solid var(--ok)}
.verify.bad{border-top-color:var(--bad)}
.band{padding:20px 22px;display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--line);background:repeating-linear-gradient(135deg,transparent 0 7px,rgba(12,31,61,.05) 7px 8px),#f6f9fc}
.seal{flex:none;width:56px;height:56px;border-radius:50%;border:3px double var(--ok);color:var(--ok);display:grid;place-items:center;font-size:26px;font-weight:600}
.band h2{margin:0;font-size:20px;color:var(--ok)}
.band p{margin:0;font-size:13px;color:var(--ink2)}
.bad .seal{border-color:var(--bad);color:var(--bad)}.bad .band h2{color:var(--bad)}
.vbody{padding:20px 22px 22px}
.who{display:flex;gap:14px;align-items:center}
.avatar{flex:none;width:68px;height:68px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:600;object-fit:cover}
.who h1{margin:0;font-size:21px;line-height:1.25}
dl{display:grid;grid-template-columns:118px 1fr;gap:8px 12px;margin:18px 0;padding-top:16px;border-top:1px solid var(--line)}
dt{color:var(--ink2);font-size:13px}dd{margin:0;font-weight:500;word-break:break-word}
.sig{border-bottom:1.5px solid var(--ink);padding:4px 0;text-align:center}
.sig img{max-width:100%;height:92px;object-fit:contain}
.sigl{font-size:12px;color:var(--ink2);margin:4px 0 0}
.hash{font-size:11px;line-height:1.5;color:var(--ink2);word-break:break-all;margin-top:16px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff;color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible,canvas:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
button{font:inherit;font-weight:600;border:1px solid var(--ink);border-radius:6px;padding:10px 16px;cursor:pointer;background:var(--ink);color:#fff}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.sm{padding:5px 10px;font-size:12.5px}
button:disabled{opacity:.5;cursor:wait}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button:not(.on){background:transparent;color:var(--ink);border-color:var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:640px){.grid{grid-template-columns:1fr}dl{grid-template-columns:96px 1fr}}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;color:var(--ink2);font-weight:500}
.pill{padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--okbg);color:var(--ok)}
.pill.bad{background:var(--badbg);color:var(--bad)}
#pad{display:block;width:100%;aspect-ratio:360/140;border:1.5px dashed var(--steel);border-radius:6px;background:#fbfdff;touch-action:none;cursor:crosshair}
.modal{position:fixed;inset:0;background:rgba(12,31,61,.6);display:grid;place-items:center;padding:16px;z-index:9}
.modal .card{max-width:340px;width:100%;margin:0;text-align:center}
#qr{display:inline-block;background:#fff;padding:14px;border:1px solid var(--line)}
.link{font-size:12px;word-break:break-all;background:var(--paper);padding:8px;border-radius:4px;margin:12px 0}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;z-index:10}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--steel);border-radius:50%;margin:12px auto;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(1turn)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<header class="top"><b>Verifikasi tanda tangan digital</b><small id="co"></small></header>
<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ====== KONFIGURASI ====== */
const CONFIG = {
  API: 'https://script.google.com/macros/s/AKfycbyg9Wrpg6T3ePN1d5nQoYNIDp8V8A7u-ELuWcGGRLO7IyMjcDu2cXmoHXf9whAvQtwd0Q/exec',   // URL deploy Apps Script, berakhiran /exec
  COMPANY: 'PT Murinda Sentra Baja',
  PUBLIC_URL: ''                       // kosongkan = otomatis memakai alamat halaman ini
};

/* ====== UTIL ====== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => d ? new Date(d).toLocaleString('id-ID', {dateStyle:'long', timeStyle:'short'}) : '-';
const linkOf = t => (CONFIG.PUBLIC_URL || location.origin + location.pathname) + '?v=' + encodeURIComponent(t);
const initials = n => String(n || '?').split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const app = $('#app');
$('#co').textContent = CONFIG.COMPANY;
let pw = '', editing = null;
try { pw = sessionStorage.getItem('pw') || ''; } catch (_) {}
const S = {personil: [], ttd: [], tab: 'buat'};

async function call(url, opt) {
  try {
    const t = await (await fetch(url, opt)).text();
    try { return JSON.parse(t); }
    catch (_) { return {ok: false, error: 'Respons bukan JSON. Deploy Web App dengan akses “Anyone” dan pakai URL berakhiran /exec.'}; }
  } catch (_) { return {ok: false, error: 'Tidak dapat terhubung ke server. Periksa CONFIG.API.'}; }
}
const get = p => call(CONFIG.API + '?' + new URLSearchParams(p));
const post = b => call(CONFIG.API, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({...b, password: pw})});
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

/* ====== HALAMAN PUBLIK: hasil scan QR ====== */
async function verifyView(id) {
  app.innerHTML = '<section class="card narrow center"><div class="spin"></div><p class="muted">Memeriksa keaslian tanda tangan…</p></section>';
  const r = await get({action: 'verify', id});
  if (!r.ok) {
    app.innerHTML = `<section class="card verify bad"><div class="band"><div class="seal">✕</div><div><h2>Tidak terverifikasi</h2><p>${esc(r.error)}</p></div></div></section>`;
    return;
  }
  const d = r.data, p = d.personil, ok = d.status === 'Valid';
  app.innerHTML = `<section class="card verify ${ok ? '' : 'bad'}">
    <div class="band"><div class="seal">${ok ? '✓' : '✕'}</div><div><h2>${ok ? 'Tanda tangan valid' : 'Tanda tangan dicabut'}</h2><p>${ok ? 'Tercatat resmi di sistem ' + esc(CONFIG.COMPANY) : 'Tanda tangan ini tidak berlaku lagi'}</p></div></div>
    <div class="vbody">
      <div class="who">${p.foto ? `<img class="avatar" src="${esc(p.foto)}" alt="">` : `<div class="avatar">${esc(initials(p.nama))}</div>`}
        <div><h1>${esc(p.nama)}</h1><div>${esc(p.jabatan)}</div><div class="muted">${esc(p.departemen || '')}</div></div></div>
      <dl><dt>ID personil</dt><dd>${esc(p.id)}</dd><dt>Dokumen</dt><dd>${esc(d.judul)}</dd><dt>Nomor dokumen</dt><dd>${esc(d.nodok || '-')}</dd><dt>Ditandatangani</dt><dd>${fmtDate(d.tanggal)}</dd><dt>Kode</dt><dd class="mono">${esc(d.token)}</dd></dl>
      <div class="sig"><img src="${esc(d.gambar)}" alt="Tanda tangan ${esc(p.nama)}"></div>
      <p class="sigl">Tanda tangan ${esc(p.nama)}</p>
      <div class="hash mono">SHA-256 ${esc(d.hash)}</div>
      <p class="sigl">Halaman ini sudah dibuka ${d.scan} kali.</p>
    </div></section>`;
}

/* ====== ADMIN ====== */
function loginView(err) {
  app.innerHTML = `<section class="card narrow"><h2>Masuk admin</h2><p class="muted">Kelola personil dan terbitkan tanda tangan digital.</p>
    <form id="lf"><label for="pw">Password</label><input type="password" id="pw" required autofocus>
    <p style="color:var(--bad);margin:8px 0 0">${esc(err || '')}</p><button style="width:100%;margin-top:12px">Masuk</button></form></section>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault(); pw = $('#pw').value;
    try { sessionStorage.setItem('pw', pw); } catch (_) {}
    await enter();
  };
}
async function refresh() { const r = await post({action: 'list'}); if (r.ok) { S.personil = r.personil; S.ttd = r.ttd; } return r; }
async function enter() {
  const r = await refresh();
  if (!r.ok) { pw = ''; try { sessionStorage.removeItem('pw'); } catch (_) {} return loginView(r.error); }
  adminView();
}
function adminView() {
  const T = [['buat', 'Terbitkan tanda tangan'], ['personil', 'Personil'], ['riwayat', 'Riwayat']];
  app.innerHTML = `<div class="tabs">${T.map(([k, l]) => `<button data-tab="${k}" class="${S.tab === k ? 'on' : ''}">${l}</button>`).join('')}<button class="ghost" data-act="logout" style="margin-left:auto">Keluar</button></div><div id="pane"></div>`;
  ({buat: paneBuat, personil: panePersonil, riwayat: paneRiwayat})[S.tab]();
}
async function done(r) { if (!r.ok) return toast(r.error); await refresh(); adminView(); toast('Tersimpan'); }

/* --- Terbitkan tanda tangan --- */
const pad = {drawn: false};
function initPad() {
  const c = $('#pad'), x = c.getContext('2d'); let on = false; pad.drawn = false;
  x.lineWidth = 2.6; x.lineCap = x.lineJoin = 'round'; x.strokeStyle = '#0c1f3d';
  const pt = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
  c.onpointerdown = e => { on = true; c.setPointerCapture(e.pointerId); const [a, b] = pt(e); x.beginPath(); x.moveTo(a, b); x.lineTo(a + .1, b + .1); x.stroke(); pad.drawn = true; };
  c.onpointermove = e => { if (!on) return; const [a, b] = pt(e); x.lineTo(a, b); x.stroke(); };
  c.onpointerup = c.onpointercancel = () => on = false;
  $('#clr').onclick = () => { x.clearRect(0, 0, c.width, c.height); pad.drawn = false; };
}
function paneBuat() {
  const act = S.personil.filter(p => p.Status === 'Aktif');
  $('#pane').innerHTML = `<section class="card"><h2>Terbitkan tanda tangan digital</h2>
    <p class="muted">Pilih personil, isi dokumen, lalu goreskan tanda tangan. QR akan mengarah langsung ke profil personil tersebut.</p>
    <form id="tf"><div class="grid"><div><label for="pid">Personil penandatangan</label><select id="pid" required><option value="">Pilih personil</option>${act.map(p => `<option value="${esc(p.ID)}">${esc(p.Nama)} (${esc(p.Jabatan)})</option>`).join('')}</select></div>
    <div><label for="nodok">Nomor dokumen</label><input id="nodok" placeholder="mis. 012/MSB/X/2026"></div></div>
    <label for="judul">Judul dokumen</label><input id="judul" required>
    <label>Tanda tangan</label><canvas id="pad" width="360" height="140" aria-label="Area tanda tangan"></canvas>
    <div class="row" style="margin-top:12px;justify-content:flex-start"><button type="button" class="ghost" id="clr">Hapus goresan</button><button>Terbitkan dan buat QR</button></div></form></section>`;
  initPad();
  $('#tf').onsubmit = async e => {
    e.preventDefault();
    if (!pad.drawn) return toast('Tanda tangan masih kosong');
    const b = e.submitter || {}; b.disabled = true;
    const r = await post({action: 'createTtd', personilId: $('#pid').value, nodok: $('#nodok').value.trim(), judul: $('#judul').value.trim(), gambar: $('#pad').toDataURL('image/png')});
    b.disabled = false;
    if (!r.ok) return toast(r.error);
    await refresh(); paneBuat(); showQR(r.token);
  };
}

/* --- Personil --- */
function panePersonil() {
  editing = null;
  $('#pane').innerHTML = `<section class="card"><h2 id="pt">Tambah personil</h2><form id="pf"><div class="grid">
    <div><label for="nama">Nama lengkap</label><input id="nama" required></div><div><label for="jab">Jabatan</label><input id="jab" required></div>
    <div><label for="dep">Departemen</label><input id="dep"></div><div><label for="foto">URL foto (opsional)</label><input id="foto" type="url"></div></div>
    <button style="margin-top:14px">Simpan personil</button></form></section>
    <section class="card tw"><table><tr><th>Nama</th><th>Jabatan</th><th>Departemen</th><th>Status</th><th></th></tr>
    ${S.personil.map(p => `<tr><td><b>${esc(p.Nama)}</b><br><small class="muted">${esc(p.ID)}</small></td><td>${esc(p.Jabatan)}</td><td>${esc(p.Departemen)}</td>
    <td><span class="pill ${p.Status === 'Aktif' ? '' : 'bad'}">${esc(p.Status)}</span></td>
    <td><button class="sm ghost" data-act="edit" data-id="${esc(p.ID)}">Ubah</button> <button class="sm ghost" data-act="tog" data-id="${esc(p.ID)}">${p.Status === 'Aktif' ? 'Nonaktifkan' : 'Aktifkan'}</button></td></tr>`).join('') || '<tr><td colspan="5" class="muted">Belum ada personil. Tambahkan yang pertama di atas.</td></tr>'}</table></section>`;
  $('#pf').onsubmit = async e => {
    e.preventDefault();
    done(await post({action: 'savePersonil', id: editing ? editing.ID : '', nama: $('#nama').value.trim(), jabatan: $('#jab').value.trim(), departemen: $('#dep').value.trim(), foto: $('#foto').value.trim(), status: editing ? editing.Status : 'Aktif'}));
  };
}

/* --- Riwayat --- */
function paneRiwayat() {
  const nm = id => (S.personil.find(p => p.ID === id) || {}).Nama || id;
  $('#pane').innerHTML = `<section class="card tw"><h2>Riwayat tanda tangan</h2><table><tr><th>Kode</th><th>Penandatangan</th><th>Dokumen</th><th>Waktu</th><th>Dibuka</th><th>Status</th><th></th></tr>
    ${[...S.ttd].reverse().map(t => `<tr><td class="mono"><small>${esc(t.Token)}</small></td><td>${esc(nm(t.PersonilID))}</td><td>${esc(t.JudulDokumen)}<br><small class="muted">${esc(t.NoDokumen)}</small></td><td>${fmtDate(t.TanggalTTD)}</td><td>${t.JumlahScan || 0}×</td>
    <td><span class="pill ${t.Status === 'Valid' ? '' : 'bad'}">${esc(t.Status)}</span></td>
    <td><button class="sm ghost" data-act="qr" data-id="${esc(t.Token)}">Lihat QR</button> <button class="sm ghost" data-act="stat" data-id="${esc(t.Token)}">${t.Status === 'Valid' ? 'Cabut' : 'Aktifkan'}</button></td></tr>`).join('') || '<tr><td colspan="7" class="muted">Belum ada tanda tangan yang diterbitkan.</td></tr>'}</table></section>`;
}

/* --- Modal QR --- */
function showQR(token) {
  const url = linkOf(token), m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-label="QR verifikasi"><h2>QR verifikasi</h2><p class="muted">Pindai untuk membuka profil penandatangan.</p><div id="qr"></div><div class="link mono">${esc(url)}</div>
    <div class="row"><button class="sm" id="cp">Salin link</button><button class="sm" id="dl">Unduh QR</button><button class="sm ghost" id="cl">Tutup</button></div></div>`;
  document.body.appendChild(m);
  new QRCode($('#qr', m), {text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M});
  $('#cl', m).onclick = () => m.remove();
  $('#cp', m).onclick = () => navigator.clipboard.writeText(url).then(() => toast('Link disalin'));
  $('#dl', m).onclick = () => {
    const s = $('#qr canvas', m), c = document.createElement('canvas'); c.width = c.height = s.width + 40;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(s, 20, 20);
    const a = document.createElement('a'); a.download = token + '.png'; a.href = c.toDataURL(); a.click();
  };
}

/* ====== EVENT ====== */
app.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab],[data-act]'); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; return adminView(); }
  const {act, id} = t.dataset;
  if (act === 'logout') { pw = ''; try { sessionStorage.removeItem('pw'); } catch (_) {} return loginView(); }
  if (act === 'qr') return showQR(id);
  if (act === 'edit') {
    const p = S.personil.find(x => x.ID === id); editing = p;
    $('#nama').value = p.Nama; $('#jab').value = p.Jabatan; $('#dep').value = p.Departemen; $('#foto').value = p.FotoURL;
    $('#pt').textContent = 'Ubah personil'; scrollTo({top: 0, behavior: 'smooth'});
  }
  if (act === 'tog') {
    const p = S.personil.find(x => x.ID === id);
    done(await post({action: 'savePersonil', id, nama: p.Nama, jabatan: p.Jabatan, departemen: p.Departemen, foto: p.FotoURL, status: p.Status === 'Aktif' ? 'Nonaktif' : 'Aktif'}));
  }
  if (act === 'stat') {
    const x = S.ttd.find(r => r.Token === id);
    done(await post({action: 'setStatus', token: id, status: x.Status === 'Valid' ? 'Dicabut' : 'Valid'}));
  }
});

/* ====== MULAI ====== */
const v = new URLSearchParams(location.search).get('v');
v ? verifyView(v) : (pw ? enter() : loginView());
</script>
</body>
</html>

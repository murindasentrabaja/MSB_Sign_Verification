<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verifikasi Tanda Tangan Digital | PT Murinda Sentra Baja</title>
<meta name="theme-color" content="#0f4aa0">
<link rel="icon" href="icon-512.png"><link rel="apple-touch-icon" href="icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a2a5e;--blue:#0f4aa0;--red:#c62828;--ok:#0b7a4f;--mut:#51668a;--ln:rgba(15,74,160,.16)}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;background:#eaf1fb}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(42vmax 42vmax at 10% 6%,rgba(15,74,160,.40),transparent 70%),radial-gradient(34vmax 34vmax at 94% 16%,rgba(198,40,40,.20),transparent 70%),radial-gradient(48vmax 48vmax at 68% 100%,rgba(46,125,220,.32),transparent 70%)}
h1,h2,h3,button,.seal,.avatar{font-family:Sora,'IBM Plex Sans',sans-serif}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.glass,.card{background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(24px) saturate(140%);backdrop-filter:blur(24px) saturate(140%);border:1px solid var(--ln);border-radius:24px;box-shadow:0 24px 48px -28px rgba(10,42,94,.35)}
.top{position:sticky;top:12px;z-index:5;margin:12px auto 0;width:calc(100% - 24px);max-width:1000px;display:flex;align-items:center;justify-content:space-between;padding:9px 20px;border-radius:99px}
.top img{height:34px;display:block}.top span{font-size:13px;color:var(--mut)}
main{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:24px 12px 32px}
footer{text-align:center;font-size:12.5px;color:var(--mut);padding:0 12px 24px}
.card{padding:24px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:20px}
.muted{color:var(--mut)}.center{text-align:center}
.narrow{max-width:400px;margin:32px auto}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.hero h1{font-size:clamp(30px,5vw,46px);line-height:1.1;margin:0 0 14px;letter-spacing:-.02em}
.lead{color:var(--mut);max-width:46ch;margin:0}
.cf{display:flex;gap:8px;margin-top:22px}.cf input{flex:1}
.mark{width:104px;display:block;margin-bottom:10px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}.steps li:last-child{border:0}
.steps li:before{counter-increment:s;content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font:600 13px Sora}
.v{max-width:560px;margin:0 auto 16px;padding:0;position:relative;overflow:hidden}
.v .wm{position:absolute;right:-28px;bottom:-16px;width:240px;opacity:.07;pointer-events:none}
.band{display:flex;gap:16px;align-items:center;padding:24px;border-bottom:1px solid var(--ln)}
.seal{flex:none;width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:30px;animation:pop .5s ease-out}
.band h2{margin:0;font-size:22px;color:var(--ok)}.band p{margin:2px 0 0;font-size:13.5px;color:var(--mut)}
.bad .seal{background:var(--red)}.bad .band h2{color:var(--red)}
.vb{padding:24px;position:relative}
.who{display:flex;gap:16px;align-items:center}
.avatar{flex:none;width:72px;height:72px;border-radius:20px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:600;object-fit:cover}
.who h1{margin:0;font-size:22px;line-height:1.25}
dl{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;margin:20px 0;padding-top:18px;border-top:1px solid var(--ln)}
dt{color:var(--mut);font-size:13px}dd{margin:0;font-weight:500;word-break:break-word}
.slip{background:rgba(255,255,255,.92);border:1px solid var(--ln);border-radius:16px;padding:12px 16px;text-align:center}
.slip img{max-width:100%;height:96px;object-fit:contain}
.sigl{font-size:12.5px;color:var(--mut);margin:6px 0 0}
.hash{font-size:11px;line-height:1.5;color:var(--mut);word-break:break-all;margin-top:16px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input,select{width:100%;padding:11px 14px;border:1px solid var(--ln);border-radius:14px;font:inherit;background:rgba(255,255,255,.7);color:var(--ink)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button{font-weight:600;font-size:14px;border:1px solid var(--blue);border-radius:99px;padding:11px 20px;cursor:pointer;background:var(--blue);color:#fff}
button.ghost,.tabs button:not(.on){background:rgba(255,255,255,.55);color:var(--ink);border-color:var(--ln)}
button.sm{padding:6px 12px;font-size:12.5px}button:disabled{opacity:.5;cursor:wait}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--ln);vertical-align:middle}
th{font-size:12.5px;color:var(--mut);font-weight:500}
.pill{padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:rgba(11,122,79,.14);color:var(--ok)}
.pill.bad{background:rgba(198,40,40,.13);color:var(--red)}
#pad{display:block;width:100%;aspect-ratio:360/140;border:1.5px dashed var(--blue);border-radius:16px;background:rgba(255,255,255,.85);touch-action:none;cursor:crosshair}
.modal{position:fixed;inset:0;background:rgba(10,42,94,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px;z-index:9}
.modal .card{max-width:340px;width:100%;margin:0;text-align:center;background:rgba(255,255,255,.8)}
#qr{display:inline-block;background:#fff;padding:14px;border-radius:16px}
.link{font-size:12px;word-break:break-all;background:rgba(15,74,160,.07);padding:8px;border-radius:10px;margin:12px 0}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;z-index:10}
.spin{width:28px;height:28px;border:3px solid var(--ln);border-top-color:var(--blue);border-radius:50%;margin:12px auto;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(1turn)}}@keyframes pop{from{transform:scale(.6);opacity:0}}
@media(max-width:760px){.hero,.grid{grid-template-columns:1fr}dl{grid-template-columns:100px 1fr}.top span{display:none}}
@media(prefers-reduced-motion:reduce){.spin,.seal{animation:none}}
@media print{body:before,.top,.acts,.toast,footer{display:none}.glass,.card{background:#fff;backdrop-filter:none;box-shadow:none}}
</style>
</head>
<body>
<header class="glass top"><a href="./" aria-label="Beranda"><img src="MSB Logo.png" alt="PT Murinda Sentra Baja"></a><span>Verifikasi tanda tangan digital</span></header>
<main id="app"></main>
<footer>© <span id="yr"></span> <span id="co"></span>. Seluruh data tanda tangan dicatat dan dapat diperiksa kapan saja.</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const CONFIG = {
  API: 'https://script.google.com/macros/s/AKfycbyg9Wrpg6T3ePN1d5nQoYNIDp8V8A7u-ELuWcGGRLO7IyMjcDu2cXmoHXf9whAvQtwd0Q/exec',
  COMPANY: 'PT Murinda Sentra Baja',
  PUBLIC_URL: ''   // kosongkan = otomatis memakai alamat halaman ini
};
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => d ? new Date(d).toLocaleString('id-ID', {dateStyle:'long', timeStyle:'short'}) : '-';
const linkOf = t => (CONFIG.PUBLIC_URL || location.origin + location.pathname) + '?v=' + encodeURIComponent(t);
const initials = n => String(n || '?').split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const app = $('#app');
$('#co').textContent = CONFIG.COMPANY; $('#yr').textContent = new Date().getFullYear();
let pw = '', editing = null;
try { pw = sessionStorage.getItem('pw') || ''; } catch (_) {}
const S = {personil: [], ttd: [], tab: 'buat'};

async function call(url, opt) {
  try {
    const t = await (await fetch(url, opt)).text();
    try { return JSON.parse(t); }
    catch (_) { return {ok: false, error: 'Respons bukan JSON. Deploy Web App dengan akses “Anyone” dan pakai URL berakhiran /exec.'}; }
  } catch (_) { return {ok: false, error: 'Tidak dapat terhubung ke server. Periksa CONFIG.API.'}; }
}
const get = p => call(CONFIG.API + '?' + new URLSearchParams(p));
const post = b => call(CONFIG.API, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({...b, password: pw})});
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

/* ====== BERANDA PUBLIK ====== */
function homeView() {
  app.innerHTML = `<section class="hero"><div class="card" style="margin:0"><h1>Pastikan tanda tangan di dokumen Anda asli.</h1>
    <p class="lead">Pindai QR pada dokumen, atau masukkan kode verifikasi di bawah. Anda akan langsung melihat siapa penandatangannya dan apakah tanda tangan itu masih berlaku.</p>
    <form class="cf" id="cf"><input id="kode" placeholder="Contoh: TTD-1A2B3C4D5E" aria-label="Kode verifikasi" required><button>Periksa</button></form>
    <p style="margin:18px 0 0"><button class="ghost sm" data-act="admin">Masuk admin</button></p></div>
    <div class="card" style="margin:0"><img class="mark" src="icon-512.png" alt=""><h2>Cara memeriksa</h2>
    <ol class="steps"><li><div><b>Pindai QR</b><br><span class="muted">Arahkan kamera ponsel ke QR di samping tanda tangan.</span></div></li>
    <li><div><b>Lihat penandatangan</b><br><span class="muted">Nama, jabatan, dan departemen tampil langsung.</span></div></li>
    <li><div><b>Cocokkan dokumen</b><br><span class="muted">Pastikan judul dan nomor dokumen sama dengan yang Anda pegang.</span></div></li></ol></div></section>`;
  $('#cf').onsubmit = e => { e.preventDefault(); const m = $('#kode').value.match(/TTD-[A-Za-z0-9]+/); if (!m) return toast('Format kode tidak dikenali'); location.href = location.pathname + '?v=' + m[0].toUpperCase(); };
}

/* ====== HASIL SCAN QR ====== */
async function verifyView(id) {
  app.innerHTML = '<section class="card narrow center"><div class="spin"></div><p class="muted">Memeriksa keaslian tanda tangan…</p></section>';
  const r = await get({action: 'verify', id});
  if (!r.ok) {
    app.innerHTML = `<section class="card v bad"><div class="band"><div class="seal">✕</div><div><h2>Tidak terverifikasi</h2><p>${esc(r.error)}</p></div></div><div class="vb"><div class="acts"><button data-act="home">Periksa kode lain</button></div></div></section>`;
    return;
  }
  const d = r.data, p = d.personil, ok = d.status === 'Valid';
  app.innerHTML = `<section class="card v ${ok ? '' : 'bad'}"><img class="wm" src="icon-512.png" alt="">
    <div class="band"><div class="seal">${ok ? '✓' : '✕'}</div><div><h2>${ok ? 'Tanda tangan valid' : 'Tanda tangan dicabut'}</h2><p>${ok ? 'Tercatat resmi di sistem ' + esc(CONFIG.COMPANY) : 'Tanda tangan ini tidak berlaku lagi'}</p></div></div>
    <div class="vb"><div class="who">${p.foto ? `<img class="avatar" src="${esc(p.foto)}" alt="">` : `<div class="avatar">${esc(initials(p.nama))}</div>`}
      <div><h1>${esc(p.nama)}</h1><div>${esc(p.jabatan)}</div><div class="muted">${esc(p.departemen || '')}</div></div></div>
      <dl><dt>ID personil</dt><dd>${esc(p.id)}</dd>${d.judul ? `<dt>Dokumen</dt><dd>${esc(d.judul)}</dd>` : ''}${d.nodok ? `<dt>Nomor dokumen</dt><dd>${esc(d.nodok)}</dd>` : ''}<dt>Ditandatangani</dt><dd>${fmtDate(d.tanggal)}</dd><dt>Kode</dt><dd class="mono">${esc(d.token)}</dd></dl>
      <div class="slip"><img src="${esc(d.gambar)}" alt="Tanda tangan ${esc(p.nama)}"></div><p class="sigl">Tanda tangan ${esc(p.nama)}</p>
      <div class="hash mono">SHA-256 ${esc(d.hash)}</div><p class="sigl">Halaman ini sudah dibuka ${d.scan} kali.</p>
      <div class="acts"><button data-act="share" data-id="${esc(d.token)}">Bagikan</button><button class="ghost" data-act="qr" data-id="${esc(d.token)}">Tampilkan QR</button><button class="ghost" data-act="print">Cetak</button></div></div></section>`;
}

/* ====== ADMIN ====== */
function loginView(err) {
  app.innerHTML = `<section class="card narrow"><h2>Masuk admin</h2><p class="muted">Kelola personil dan terbitkan tanda tangan digital.</p>
    <form id="lf"><label for="pw">Password</label><input type="password" id="pw" required autofocus>
    <p style="color:var(--red);margin:8px 0 0">${esc(err || '')}</p><button style="width:100%;margin-top:12px">Masuk</button></form></section>`;
  $('#lf').onsubmit = async e => { e.preventDefault(); pw = $('#pw').value; try { sessionStorage.setItem('pw', pw); } catch (_) {} await enter(); };
}
async function refresh() { const r = await post({action: 'list'}); if (r.ok) { S.personil = r.personil; S.ttd = r.ttd; } return r; }
async function enter() {
  const r = await refresh();
  if (!r.ok) { pw = ''; try { sessionStorage.removeItem('pw'); } catch (_) {} return loginView(r.error); }
  adminView();
}
function adminView() {
  const T = [['buat', 'Terbitkan tanda tangan'], ['personil', 'Personil'], ['riwayat', 'Riwayat']];
  app.innerHTML = `<div class="tabs">${T.map(([k, l]) => `<button data-tab="${k}" class="${S.tab === k ? 'on' : ''}">${l}</button>`).join('')}<button class="ghost" data-act="logout" style="margin-left:auto">Keluar</button></div><div id="pane"></div>`;
  ({buat: paneBuat, personil: panePersonil, riwayat: paneRiwayat})[S.tab]();
}
async function done(r) { if (!r.ok) return toast(r.error); await refresh(); adminView(); toast('Tersimpan'); }

const pad = {drawn: false};
function initPad() {
  const c = $('#pad'), x = c.getContext('2d'); let on = false; pad.drawn = false;
  x.lineWidth = 2.6; x.lineCap = x.lineJoin = 'round'; x.strokeStyle = '#0a2a5e';
  const pt = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
  c.onpointerdown = e => { on = true; c.setPointerCapture(e.pointerId); const [a, b] = pt(e); x.beginPath(); x.moveTo(a, b); x.lineTo(a + .1, b + .1); x.stroke(); pad.drawn = true; };
  c.onpointermove = e => { if (!on) return; const [a, b] = pt(e); x.lineTo(a, b); x.stroke(); };
  c.onpointerup = c.onpointercancel = () => on = false;
  $('#clr').onclick = () => { x.clearRect(0, 0, c.width, c.height); pad.drawn = false; };
}
function paneBuat() {
  const act = S.personil.filter(p => p.Status === 'Aktif' && p.hasTtd);
  $('#pane').innerHTML = `<section class="card"><h2>Terbitkan tanda tangan</h2>
    <p class="muted">Tanda tangan personil sudah tersimpan dan bisa dipakai berulang untuk dokumen apa pun. Setiap penerbitan mendapat QR sendiri, dengan waktu penandatanganan yang dicatat otomatis.</p>
    <form id="tf"><div class="grid"><div><label for="pid">Personil penandatangan</label><select id="pid" required><option value="">Pilih personil</option>${act.map(p => `<option value="${esc(p.ID)}">${esc(p.Nama)} (${esc(p.Jabatan)})</option>`).join('')}</select></div>
    <div><label for="nodok">Nomor dokumen (opsional)</label><input id="nodok" placeholder="mis. 012/MSB/X/2026"></div></div>
    <label for="judul">Judul dokumen (opsional)</label><input id="judul">
    ${act.length ? '' : '<p class="muted">Belum ada personil aktif yang punya tanda tangan. Tambahkan di tab Personil.</p>'}
    <button style="margin-top:16px">Terbitkan dan buat QR</button></form></section>`;
  $('#tf').onsubmit = async e => {
    e.preventDefault();
    const b = e.submitter || {}; b.disabled = true;
    const r = await post({action: 'createTtd', personilId: $('#pid').value, nodok: $('#nodok').value.trim(), judul: $('#judul').value.trim()});
    b.disabled = false;
    if (!r.ok) return toast(r.error);
    await refresh(); paneBuat(); showQR(r.token);
  };
}
function panePersonil() {
  editing = null;
  $('#pane').innerHTML = `<section class="card"><h2 id="pt">Tambah personil</h2><form id="pf"><div class="grid">
    <div><label for="nama">Nama lengkap</label><input id="nama" required></div><div><label for="jab">Jabatan</label><input id="jab" required></div>
    <div><label for="dep">Departemen</label><input id="dep"></div><div><label for="foto">URL foto (opsional)</label><input id="foto" type="url"></div></div>
    <label>Tanda tangan (cukup digoreskan sekali)</label><canvas id="pad" width="360" height="140" aria-label="Area tanda tangan"></canvas>
    <p class="sigl">Saat mengubah personil, biarkan kosong jika tanda tangan tidak diganti.</p>
    <div class="row" style="margin-top:14px;justify-content:flex-start"><button type="button" class="ghost" id="clr">Hapus goresan</button><button>Simpan personil</button></div></form></section>
    <section class="card tw"><table><tr><th>Nama</th><th>Jabatan</th><th>Departemen</th><th>Tanda tangan</th><th>Status</th><th></th></tr>
    ${S.personil.map(p => `<tr><td><b>${esc(p.Nama)}</b><br><small class="muted">${esc(p.ID)}</small></td><td>${esc(p.Jabatan)}</td><td>${esc(p.Departemen)}</td>
    <td><span class="pill ${p.hasTtd ? '' : 'bad'}">${p.hasTtd ? 'Tersimpan' : 'Belum ada'}</span></td>
    <td><span class="pill ${p.Status === 'Aktif' ? '' : 'bad'}">${esc(p.Status)}</span></td>
    <td>${p.hasTtd && p.Status === 'Aktif' ? `<button class="sm" data-act="sign" data-id="${esc(p.ID)}">Terbitkan QR</button> ` : ''}<button class="sm ghost" data-act="edit" data-id="${esc(p.ID)}">Ubah</button> <button class="sm ghost" data-act="tog" data-id="${esc(p.ID)}">${p.Status === 'Aktif' ? 'Nonaktifkan' : 'Aktifkan'}</button></td></tr>`).join('') || '<tr><td colspan="6" class="muted">Belum ada personil. Tambahkan yang pertama di atas.</td></tr>'}</table></section>`;
  initPad();
  $('#pf').onsubmit = async e => {
    e.preventDefault();
    if (!editing && !pad.drawn) return toast('Goreskan tanda tangan dulu');
    done(await post({action: 'savePersonil', id: editing ? editing.ID : '', nama: $('#nama').value.trim(), jabatan: $('#jab').value.trim(), departemen: $('#dep').value.trim(), foto: $('#foto').value.trim(), status: editing ? editing.Status : 'Aktif', gambar: pad.drawn ? $('#pad').toDataURL('image/png') : ''}));
  };
}
function paneRiwayat() {
  const nm = id => (S.personil.find(p => p.ID === id) || {}).Nama || id;
  $('#pane').innerHTML = `<section class="card tw"><h2>Riwayat tanda tangan</h2><table><tr><th>Kode</th><th>Penandatangan</th><th>Dokumen</th><th>Waktu</th><th>Dibuka</th><th>Status</th><th></th></tr>
    ${[...S.ttd].reverse().map(t => `<tr><td class="mono"><small>${esc(t.Token)}</small></td><td>${esc(nm(t.PersonilID))}</td><td>${esc(t.JudulDokumen || 'Tanpa keterangan dokumen')}<br><small class="muted">${esc(t.NoDokumen)}</small></td><td>${fmtDate(t.TanggalTTD)}</td><td>${t.JumlahScan || 0}×</td>
    <td><span class="pill ${t.Status === 'Valid' ? '' : 'bad'}">${esc(t.Status)}</span></td>
    <td><button class="sm ghost" data-act="qr" data-id="${esc(t.Token)}">Lihat QR</button> <button class="sm ghost" data-act="stat" data-id="${esc(t.Token)}">${t.Status === 'Valid' ? 'Cabut' : 'Aktifkan'}</button></td></tr>`).join('') || '<tr><td colspan="7" class="muted">Belum ada tanda tangan yang diterbitkan.</td></tr>'}</table></section>`;
}

function showQR(token) {
  const url = linkOf(token), m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-label="QR verifikasi"><h2>QR verifikasi</h2><p class="muted">Pindai untuk membuka profil penandatangan.</p><div id="qr"></div><div class="link mono">${esc(url)}</div>
    <div class="row"><button class="sm" id="cp">Salin link</button><button class="sm" id="dl">Unduh QR</button><button class="sm ghost" id="cl">Tutup</button></div></div>`;
  document.body.appendChild(m);
  new QRCode($('#qr', m), {text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M});
  m.onclick = e => { if (e.target === m) m.remove(); };
  $('#cl', m).onclick = () => m.remove();
  $('#cp', m).onclick = () => navigator.clipboard.writeText(url).then(() => toast('Link disalin'));
  $('#dl', m).onclick = () => {
    const s = $('#qr canvas', m), c = document.createElement('canvas'); c.width = c.height = s.width + 40;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(s, 20, 20);
    const a = document.createElement('a'); a.download = token + '.png'; a.href = c.toDataURL(); a.click();
  };
}

app.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab],[data-act]'); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; return adminView(); }
  const {act, id} = t.dataset;
  if (act === 'admin') return pw ? enter() : loginView();
  if (act === 'home') return (location.href = location.pathname);
  if (act === 'logout') { pw = ''; try { sessionStorage.removeItem('pw'); } catch (_) {} return homeView(); }
  if (act === 'qr') return showQR(id);
  if (act === 'print') return print();
  if (act === 'share') { const u = linkOf(id); return navigator.share ? navigator.share({title: 'Verifikasi tanda tangan digital', url: u}).catch(() => {}) : navigator.clipboard.writeText(u).then(() => toast('Link disalin')); }
  if (act === 'sign') { const r = await post({action: 'createTtd', personilId: id}); if (!r.ok) return toast(r.error); await refresh(); return showQR(r.token); }
  if (act === 'edit') {
    const p = S.personil.find(x => x.ID === id); editing = p;
    $('#nama').value = p.Nama; $('#jab').value = p.Jabatan; $('#dep').value = p.Departemen; $('#foto').value = p.FotoURL;
    $('#pt').textContent = 'Ubah personil'; scrollTo({top: 0, behavior: 'smooth'});
  }
  if (act === 'tog') {
    const p = S.personil.find(x => x.ID === id);
    done(await post({action: 'savePersonil', id, nama: p.Nama, jabatan: p.Jabatan, departemen: p.Departemen, foto: p.FotoURL, status: p.Status === 'Aktif' ? 'Nonaktif' : 'Aktif'}));
  }
  if (act === 'stat') {
    const x = S.ttd.find(r => r.Token === id);
    done(await post({action: 'setStatus', token: id, status: x.Status === 'Valid' ? 'Dicabut' : 'Valid'}));
  }
});

const v = new URLSearchParams(location.search).get('v');
v ? verifyView(v) : (pw ? enter() : homeView());
</script>
</body>
</html>
